[project]
name = "python-practice"
version = "0.1.0"
description = "ETL pipeline for loading student data into PostgreSQL and generating analytics reports"
readme = "README.md"
authors = [
    { name = "vlucas84", email = "vladimir.lukyanenko84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
python-practice = "python_practice.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
